{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="?q={{ query|urlencode }}&page={{ page_obj.previous_page_number }}" data-i18n-en="← Previous" data-i18n-tr="← Önceki">← Previous</a>
  {% endif %}
  <span data-i18n-en="Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}" data-i18n-tr="Sayfa {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?q={{ query|urlencode }}&page={{ page_obj.next_page_number }}" data-i18n-en="Next →" data-i18n-tr="Sonraki →">Next →</a>
  {% endif %}
</nav>
{% endif %}
